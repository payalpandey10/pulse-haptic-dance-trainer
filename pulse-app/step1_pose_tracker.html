<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step 1 — Pose Skeleton Test</title>
<style>
  body {
    margin: 0;
    background: #12141c;
    color: #edeef2;
    font-family: -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { font-size: 18px; margin-bottom: 4px; }
  p.status { color: #8b8fa3; font-size: 13px; margin-bottom: 16px; }
  .stage {
    position: relative;
    width: 100%;
    max-width: 480px;
    aspect-ratio: 3 / 4;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
  }
  video, canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  video { transform: scaleX(-1); }
  canvas { transform: scaleX(-1); }
  button {
    margin-top: 16px;
    padding: 12px 20px;
    background: #ff5470;
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
  }
  #fps { font-family: monospace; font-size: 12px; color: #3ae8c4; margin-top: 8px; }
</style>
</head>
<body>
<h1>Step 1: Pose skeleton test</h1>
<p class="status" id="status">Press start, then allow camera access.</p>
<div class="stage">
  <video id="video" playsinline></video>
  <canvas id="canvas"></canvas>
</div>
<button id="startBtn">Start camera</button>
<div id="fps"></div>

<!-- MediaPipe Tasks Vision (Pose Landmarker) -->
<script type="module">
import {
  PoseLandmarker,
  FilesetResolver,
  DrawingUtils
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const fpsEl = document.getElementById('fps');

let poseLandmarker = null;
let running = false;
let lastTime = performance.now();

async function setup() {
  statusEl.textContent = 'Loading pose model…';
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numPoses: 1
  });
  statusEl.textContent = 'Model loaded. Starting camera…';
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  statusEl.textContent = 'Tracking live — move around to test.';
  running = true;
  renderLoop();
}

function renderLoop() {
  if (!running) return;
  const now = performance.now();
  if (poseLandmarker && video.readyState >= 2) {
    const result = poseLandmarker.detectForVideo(video, now);
    ctx.save();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (result.landmarks && result.landmarks.length > 0) {
      const drawer = new DrawingUtils(ctx);
      for (const landmarks of result.landmarks) {
        drawer.drawLandmarks(landmarks, { radius: 4, color: '#ff5470' });
        drawer.drawConnectors(landmarks, PoseLandmarker.POSE_CONNECTIONS, { color: '#3ae8c4', lineWidth: 2 });
      }
    }
    ctx.restore();
  }
  const dt = now - lastTime;
  lastTime = now;
  fpsEl.textContent = `~${Math.round(1000 / dt)} fps`;
  requestAnimationFrame(renderLoop);
}

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  await setup();
  await startCamera();
});
</script>
</body>
</html>
